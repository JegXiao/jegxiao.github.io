<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>var t=localStorage.getItem('of-theme');if(t==='dark'||(t!=='light'&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark')</script>
<title data-i18n="团队 - OpenFlow 开放流动">团队 - OpenFlow 开放流动</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">OpenFlow 开放流动<span>.</span></div>
    <nav>
      <a href="1首页.html" data-i18n="首页">首页</a>
      <a href="2关于.html" data-i18n="关于">关于</a>
      <a href="3项目.html" data-i18n="项目">项目</a>
      <a href="4团队.html" data-i18n="团队">团队</a>
    </nav>
    <div class="controls">
      <div class="dropdown">
        <button class="dropdown-toggle" onclick="toggleDropdown(this)">主题</button>
        <div class="dropdown-menu">
          <button onclick="setTheme('light')" data-i18n="主题：亮">主题：亮</button>
          <button onclick="setTheme('dark')" data-i18n="主题：暗">主题：暗</button>
          <button onclick="setTheme('system')" data-i18n="主题：跟随系统">主题：跟随系统</button>
        </div>
      </div>
      <div class="dropdown">
        <button class="dropdown-toggle" onclick="toggleDropdown(this)" data-i18n="语言：简体中文">语言：简体中文</button>
        <div class="dropdown-menu">
          <button onclick="setLang('zh')">语言：简体中文</button>
          <button onclick="setLang('zh-TW')">语言：繁體中文</button>
          <button onclick="setLang('en')">Language: English</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <section>
    <div class="container">
      <h2 class="section-title" data-i18n="团队成员">团队成员</h2>
      <div class="grid-3">
        <div class="card" style="text-align:center;">
          <div style="width:80px;height:80px;border-radius:50%;background:var(--hero-bg);margin:0 auto 12px;"></div>
          <h3 data-i18n="成员一">成员一</h3>
          <p style="font-size:.85rem;color:var(--text-muted);" data-i18n="角色">角色</p>
        </div>
        <div class="card" style="text-align:center;">
          <div style="width:80px;height:80px;border-radius:50%;background:var(--hero-bg);margin:0 auto 12px;"></div>
          <h3 data-i18n="成员二">成员二</h3>
          <p style="font-size:.85rem;color:var(--text-muted);" data-i18n="角色">角色</p>
        </div>
        <div class="card" style="text-align:center;">
          <div style="width:80px;height:80px;border-radius:50%;background:var(--hero-bg);margin:0 auto 12px;"></div>
          <h3 data-i18n="成员三">成员三</h3>
          <p style="font-size:.85rem;color:var(--text-muted);" data-i18n="角色">角色</p>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="container">
    <div>© 2026 OpenFlow 开放流动</div>
  </div>
</footer>

<script src="../js/theme.js"></script>
<script src="0_head-i18n.js"></script>
<script src="4团队-i18n.js"></script>
<script src="../js/i18n-core.js"></script>
<script>renderLang();</script>
</body>
</html>
