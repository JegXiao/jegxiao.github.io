<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>非物理光影 · Stylized Lighting Demo</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05060e;font-family:monospace;}
  #tip{position:fixed;left:12px;top:12px;color:#9fb6ff;font-size:12px;line-height:1.7;
       background:rgba(5,8,20,.55);padding:8px 12px;border:1px solid #2a3a6a;border-radius:8px;
       pointer-events:none;user-select:none;}
  b{color:#7fd4ff}
</style>
</head>
<body>
<div id="tip">
  <b>非物理光影演示</b><br>
  · 假反射：镜像几何体（非射线追踪）<br>
  · 假Bloom：加法混合光晕贴图（无后处理）<br>
  · Fresnel 边缘光 + 手动"全局光"染色<br>
  拖动旋转 · 滚轮缩放
</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060e, 0.028); // 雾：非物理但增强纵深
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 100);
camera.position.set(0, 3.2, 8);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = 1.45;

/* ---------- 地面：半透明"假镜面"，下面放镜像物体 ---------- */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 48),
  new THREE.MeshBasicMaterial({color:0x0a0f22, transparent:true, opacity:.62})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* ---------- 核心技巧1：Fresnel 边缘光（自定义 shader，零物理） ---------- */
const rimMat = new THREE.ShaderMaterial({
  uniforms:{ uColor:{value:new THREE.Color(0x4fc3ff)}, uTime:{value:0}, uPower:{value:2.5} },
  vertexShader:`
    varying vec3 vN; varying vec3 vV; varying vec3 vP;
    void main(){
      vec4 wp = modelMatrix * vec4(position,1.);
      vP = position;
      vN = normalize(mat3(modelMatrix)*normal);
      vV = normalize(cameraPosition - wp.xyz);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader:`
    uniform vec3 uColor; uniform float uTime; uniform float uPower;
    varying vec3 vN; varying vec3 vV; varying vec3 vP;
    void main(){
      float rim = pow(1. - abs(dot(normalize(vN), normalize(vV))), uPower);
      float band = .5 + .5*sin(vP.y*3.0 - uTime*1.6);      // 能量条带滚动（纯装饰，非物理）
      vec3 base = vec3(.03,.05,.12);
      vec3 col = base + uColor * rim * (0.9 + .5*band);
      col += uColor * .12 * band;                            // 内部微光
      gl_FragColor = vec4(col, 1.);
    }`
});

/* ---------- 中央晶体 ---------- */
const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(1.5, 0), rimMat.clone());
crystal.material.uniforms.uColor.value = new THREE.Color(0x4fc3ff);
crystal.position.y = 2.2;
scene.add(crystal);

/* 环绕的碎石柱 */
const pillars = [];
for(let i=0;i<7;i++){
  const a = i/7*Math.PI*2;
  const p = new THREE.Mesh(new THREE.BoxGeometry(.4, 1+Math.random()*2.4, .4), rimMat.clone());
  p.material.uniforms.uColor.value = new THREE.Color().setHSL(.55+Math.random()*.15, .9, .6);
  p.position.set(Math.cos(a)*5.5, p.geometry.parameters.height/2, Math.sin(a)*5.5);
  p.rotation.y = Math.random()*Math.PI;
  pillars.push(p); scene.add(p);
}

/* ---------- 核心技巧2：假 Bloom —— 加法混合的光晕精灵 ---------- */
function makeGlow(color, size){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64,64,0,64,64,64);
  grad.addColorStop(0,'rgba(255,255,255,1)');
  grad.addColorStop(.25,color);
  grad.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0,0,128,128);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(c), blending:THREE.AdditiveBlending,
    depthWrite:false, transparent:true
  }));
  sp.scale.setScalar(size);
  return sp;
}
const coreGlow = makeGlow('rgba(80,200,255,.9)', 6);
coreGlow.position.copy(crystal.position);
scene.add(coreGlow);
// 漂浮小光点（每个都是一张光晕贴图，不是真实光源）
const motes = [];
for(let i=0;i<40;i++){
  const m = makeGlow(['rgba(80,200,255,.7)','rgba(255,120,220,.6)','rgba(120,255,200,.6)'][i%3], .6+Math.random()*.8);
  m.position.set((Math.random()-.5)*12, .5+Math.random()*6, (Math.random()-.5)*12);
  m.userData = {s:.6+Math.random()*.8, o:Math.random()*Math.PI*2};
  motes.push(m); scene.add(m);
}

/* ---------- 核心技巧3：假反射 —— 把场景 scale(1,-1,1) 镜像一遍 ---------- */
const mirrorGroup = new THREE.Group();
mirrorGroup.scale.set(1,-1,1);
scene.add(mirrorGroup);
const mCrystal = crystal.clone(); mirrorGroup.add(mCrystal);
const mPillars = pillars.map(p=>{const q=p.clone(); mirrorGroup.add(q); return q;});
const mGlow = coreGlow.clone(); mirrorGroup.add(mGlow);
// 镜像体统一调暗，假装地面有吸收
mirrorGroup.traverse(o=>{ if(o.material) o.material = o.material.clone(); });

/* "点光源"其实只是 MeshBasicMaterial 的小球 + 光晕 —— 没有任何真实光照计算 */
renderer.shadowMap.enabled = false; // 明确：不用阴影贴图

/* ---------- 动画 ---------- */
const clock = new THREE.Clock();
function tick(){
  const t = clock.getElapsedTime();
  rimMat.uniforms.uTime.value = t;
  crystal.rotation.y = t*.5; crystal.rotation.x = Math.sin(t*.3)*.3;
  crystal.position.y = 2.2 + Math.sin(t)*0.25;
  crystal.material.uniforms.uTime.value = t;
  pillars.forEach((p,i)=>{
    p.material.uniforms.uTime.value = t;
    p.rotation.y += .002;
    p.position.y = p.geometry.parameters.height/2 + Math.sin(t+i)*0.05; // 呼吸悬浮
  });
  motes.forEach(m=>{
    m.position.y += Math.sin(t*1.2 + m.userData.o)*.004;
    m.scale.setScalar(m.userData.s * (1 + .25*Math.sin(t*2 + m.userData.o))); // 光点脉动
  });
  coreGlow.position.copy(crystal.position);
  coreGlow.scale.setScalar(6*(1+.15*Math.sin(t*2)));
  // 同步镜像
  mCrystal.position.copy(crystal.position);
  mCrystal.rotation.copy(crystal.rotation);
  mGlow.position.copy(coreGlow.position);
  mGlow.scale.copy(coreGlow.scale);
  pillars.forEach((p,i)=>{ mPillars[i].position.copy(p.position); mPillars[i].rotation.copy(p.rotation); });
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
