<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>真实渲染 · PBR Lighting Demo</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05060e;font-family:monospace;}
  #tip{position:fixed;left:12px;top:12px;color:#9fb6ff;font-size:12px;line-height:1.7;
       background:rgba(5,8,20,.55);padding:8px 12px;border:1px solid #2a3a6a;border-radius:8px;
       pointer-events:none;user-select:none;}
  b{color:#7fd4ff}
</style>
</head>
<body>
<div id="tip">
  <b>真实渲染演示（PBR / GPU）</b><br>
  · MeshPhysicalMaterial：透射玻璃 + IOR<br>
  · 真实点光源 ×3 + 方向光阴影贴图<br>
  · PMREM 环境光照 + 实时平面反射<br>
  · ACES Filmic 色调映射 + Unreal Bloom<br>
  拖动旋转 · 滚轮缩放
</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {Reflector} from 'three/addons/objects/Reflector.js';

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;                    // 真实阴影贴图
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // 真实色调映射
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060e, 0.02);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 100);
camera.position.set(0, 3.2, 8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = 1.45;

/* ---------- 环境光照：PMREM 预滤波环境贴图（真实 IBL） ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------- 地面：实时平面反射（GPU RenderTarget，真实的镜面） ---------- */
const mirror = new Reflector(new THREE.CircleGeometry(14, 48), {
  textureWidth: 1024, textureHeight: 1024, color: 0x889999
});
mirror.rotation.x = -Math.PI/2;
scene.add(mirror);
// 反射之上叠一层暗色粗糙地面，模拟"磨砂镜面"
const floorMat = new THREE.MeshStandardMaterial({
  color:0x0a0f1a, roughness:.6, metalness:.4, transparent:true, opacity:.55
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(14, 48), floorMat);
floor.rotation.x = -Math.PI/2; floor.position.y = .01; floor.receiveShadow = true;
scene.add(floor);

/* ---------- 中央晶体：透射玻璃（真实的折射/反射 BRDF） ---------- */
const crystal = new THREE.Mesh(
  new THREE.OctahedronGeometry(1.5, 0),
  new THREE.MeshPhysicalMaterial({
    color:0x9fdcff, metalness:0, roughness:.05,
    transmission:.95, ior:1.6, thickness:1.5,
    emissive:0x2288cc, emissiveIntensity:.6,
    clearcoat:1, clearcoatRoughness:.1
  })
);
crystal.position.y = 2.2;
crystal.castShadow = true;
scene.add(crystal);

/* 石柱：拉丝金属（PBR 金属反射环境） */
const pillars = [];
for(let i=0;i<7;i++){
  const a = i/7*Math.PI*2, h = 1+Math.random()*2.4;
  const p = new THREE.Mesh(
    new THREE.BoxGeometry(.4, h, .4),
    new THREE.MeshStandardMaterial({
      color:new THREE.Color().setHSL(.55+Math.random()*.12,.6,.5),
      metalness:.95, roughness:.25+Math.random()*.3
    })
  );
  p.position.set(Math.cos(a)*5.5, h/2, Math.sin(a)*5.5);
  p.rotation.y = Math.random()*Math.PI;
  p.castShadow = p.receiveShadow = true;
  pillars.push(p); scene.add(p);
}

/* ---------- 真实光源 ---------- */
// 方向光（投影）
const sun = new THREE.DirectionalLight(0x88aaff, 1.2);
sun.position.set(6, 10, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -10;
sun.shadow.camera.right = sun.shadow.camera.top = 10;
scene.add(sun);
// 环绕运动的三色点光源（真实光强衰减 + 投影）
const pointLights = [];
const plColors = [0x4fc3ff, 0xff66cc, 0x66ffcc];
plColors.forEach((c,i)=>{
  const pl = new THREE.PointLight(c, 30, 20, 2); // intensity, distance, decay=2（物理平方衰减）
  pl.castShadow = true;
  pl.shadow.mapSize.set(512, 512);
  scene.add(pl);
  // 光源可视化小球（真实发光体）
  const orb = new THREE.Mesh(new THREE.SphereGeometry(.12,16,16),
    new THREE.MeshBasicMaterial({color:c}));
  pl.add(orb); pl.userData.orb = orb;
  pointLights.push(pl);
});
scene.add(new THREE.AmbientLight(0x223355, .4));

/* ---------- 后处理：Bloom（真实 HDR 辉光） ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .8, .6, .85);
composer.addPass(bloom);

/* ---------- 动画 ---------- */
const clock = new THREE.Clock();
function tick(){
  const t = clock.getElapsedTime();
  crystal.rotation.y = t*.5; crystal.rotation.x = Math.sin(t*.3)*.3;
  crystal.position.y = 2.2 + Math.sin(t)*0.25;
  pointLights.forEach((pl,i)=>{
    const a = t*.6 + i/3*Math.PI*2;
    pl.position.set(Math.cos(a)*4.5, 1.5+Math.sin(t*1.3+i)*1.2, Math.sin(a)*4.5);
    pl.userData.orb.material.color.setHSL((.5+i*.1+t*.02)%1, .9, .6);
  });
  controls.update();
  composer.render();
  requestAnimationFrame(tick);
}
tick();
addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
